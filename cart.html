<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Eloria</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- CSS -->

    <link rel="stylesheet" href="css/main.css">

    <link rel="stylesheet" href="css/cart.css">

</head>


<body>


<!-- Navbar -->

<div id="navbar"></div>



<!-- =====================================================
     CART PAGE
===================================================== -->

<section class="cart-section">

    <div class="container">


        <div class="cart-title">

            <p>
                YOUR BAG
            </p>

            <h1>
                Shopping Cart
            </h1>

        </div>



        <div class="row g-5">


            <!-- CART PRODUCTS -->

            <div class="col-lg-8">

                <div
                    id="cartProducts">

                </div>

            </div>



            <!-- ORDER SUMMARY -->

            <div class="col-lg-4">

                <div class="order-summary">

                    <h3>
                        Order Summary
                    </h3>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong id="cartSubtotal">
                            ₹0
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <strong id="deliveryCharge">
                            ₹0
                        </strong>

                    </div>


                    <hr>


                    <div class="summary-row total-row">

                        <span>
                            Total
                        </span>

                        <strong id="cartTotal">
                            ₹0
                        </strong>

                    </div>


                    <button
                        id="checkoutButton"
                        class="btn eloria-btn w-100 mt-4"
                        onclick="checkout()">

                        Place Order

                    </button>

                </div>

            </div>

        </div>

    </div>

</section>



<!-- Footer -->

<div id="footer"></div>



<!-- Bootstrap -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- JavaScript -->

<script src="js/common.js"></script>

<script src="js/products.js"></script>

<script src="js/cart.js"></script>


</body>

</html>
