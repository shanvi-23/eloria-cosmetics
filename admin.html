<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | Eloria</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- CSS -->

    <link rel="stylesheet" href="css/main.css">

    <link rel="stylesheet" href="css/admin.css">

</head>


<body>


<!-- =====================================================
     ADMIN NAVBAR
===================================================== -->

<nav class="admin-navbar">

    <div class="container">

        <h2>
            Eloria Admin
        </h2>

        <a href="index.html">
            View Website
        </a>

    </div>

</nav>



<!-- =====================================================
     ADMIN PAGE
===================================================== -->

<section class="admin-section">

    <div class="container">


        <div class="admin-heading">

            <p>
                ADMINISTRATION
            </p>

            <h1>
                Product Management
            </h1>

        </div>



        <!-- =================================================
             ADD PRODUCT
        ================================================== -->

        <div class="admin-card">

            <h3>
                Add New Product
            </h3>


            <form id="adminProductForm">


                <div class="row g-3">


                    <!-- Product name -->

                    <div class="col-md-6">

                        <label>
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="adminName"
                            required>

                    </div>



                    <!-- Category -->

                    <div class="col-md-3">

                        <label>
                            Category
                        </label>

                        <select
                            id="adminCategory"
                            required>

                            <option value="Makeup">
                                Makeup
                            </option>

                            <option value="Skincare">
                                Skincare
                            </option>

                        </select>

                    </div>



                    <!-- Price -->

                    <div class="col-md-3">

                        <label>
                            Price
                        </label>

                        <input
                            type="number"
                            id="adminPrice"
                            required>

                    </div>



                    <!-- Image -->

                    <div class="col-md-12">

                        <label>
                            Image URL
                        </label>

                        <input
                            type="url"
                            id="adminImage"
                            required>

                    </div>



                    <!-- Description -->

                    <div class="col-md-12">

                        <label>
                            Description
                        </label>

                        <textarea
                            id="adminDescription"
                            required>
                        </textarea>

                    </div>



                    <!-- Add -->

                    <div class="col-md-12">

                        <button
                            type="submit"
                            class="btn eloria-btn">

                            Add Product

                        </button>

                    </div>

                </div>

            </form>


            <p id="adminMessage"></p>

        </div>



        <!-- =================================================
             PRODUCTS
        ================================================== -->

        <div class="admin-card">

            <h3>
                Current Products
            </h3>


            <div
                id="adminProducts"
                class="table-responsive">

            </div>

        </div>



        <!-- =================================================
             ORDERS
        ================================================== -->

        <div class="admin-card">

            <h3>
                Customer Orders
            </h3>


            <div
                id="adminOrders">

            </div>

        </div>

    </div>

</section>



<!-- JavaScript -->

<script src="js/products.js"></script>

<script src="js/admin.js"></script>


</body>

</html>
