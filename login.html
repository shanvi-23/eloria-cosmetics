<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | Eloria</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- CSS -->

    <link rel="stylesheet" href="css/main.css">

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>


<!-- Navbar -->

<div id="navbar"></div>



<!-- =====================================================
     LOGIN
===================================================== -->

<section class="auth-section">

    <div class="auth-card">


        <p class="auth-small-title">
            WELCOME BACK
        </p>


        <h1>
            Login
        </h1>


        <p class="auth-description">
            Login to access your Eloria account.
        </p>



        <!-- Login form -->

        <form id="loginForm">


            <!-- Email -->

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required>

            </div>



            <!-- Password -->

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required>

            </div>



            <!-- Login button -->

            <button
                type="submit"
                class="btn eloria-btn w-100">

                Login

            </button>

        </form>



        <!-- Message -->

        <p
            id="loginMessage"
            class="auth-message">

        </p>



        <!-- Register link -->

        <p class="auth-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>

</section>



<!-- Footer -->

<div id="footer"></div>



<!-- JavaScript -->

<script src="js/common.js"></script>

<script src="js/auth.js"></script>


</body>

</html>
