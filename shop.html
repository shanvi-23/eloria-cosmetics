<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shop | Eloria</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- CSS -->

    <link rel="stylesheet" href="css/main.css">

    <link rel="stylesheet" href="css/shop.css">

</head>


<body>


<!-- Navbar -->

<div id="navbar"></div>



<!-- =====================================================
     SHOP HEADER
===================================================== -->

<section class="shop-header">

    <div class="container text-center">

        <p>
            ELORIA COLLECTION
        </p>

        <h1>
            Shop Beauty
        </h1>

        <span>
            Discover makeup and skincare essentials.
        </span>

    </div>

</section>



<!-- =====================================================
     SHOP CONTENT
===================================================== -->

<section class="shop-section">

    <div class="container">


        <!-- Search -->

        <div class="shop-search">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="shopSearch"
                placeholder="Search products...">

        </div>



        <!-- Category buttons -->

        <div class="category-filters text-center">

            <button
                class="filter-button active"
                onclick="filterShop('All')">

                All

            </button>


            <button
                class="filter-button"
                onclick="filterShop('Makeup')">

                Makeup

            </button>


            <button
                class="filter-button"
                onclick="filterShop('Skincare')">

                Skincare

            </button>

        </div>



        <!-- Product count -->

        <p
            id="productCount"
            class="product-count">

        </p>



        <!-- Products -->

        <div
            id="shopProducts"
            class="row g-4">

        </div>

    </div>

</section>



<!-- Footer -->

<div id="footer"></div>



<!-- Bootstrap -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- JavaScript -->

<script src="js/common.js"></script>

<script src="js/products.js"></script>

<script src="js/shop.js"></script>


</body>

</html>
